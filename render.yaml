services:
  - type: web
    name: luminova-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: luminova-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: TRUSTED_HOSTS
        value: "luminova-api.onrender.com"
      - key: CORS_ORIGINS
        value: "https://SEU-SITE.netlify.app"

databases:
  - name: luminova-db
    databaseName: luminova
    user: luminova_user
